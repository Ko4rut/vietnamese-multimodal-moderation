name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,modeling,api]"
      - name: Lint
        run: ruff check src apps/api tests
      - name: Run unit tests (offline)
        run: pytest -q
      - name: Check installed package CLI
        run: python -m vietnamese_topic_classification --list-domains

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Lint web
        run: npm run lint
      - name: Type-check and build web
        run: npm run build
