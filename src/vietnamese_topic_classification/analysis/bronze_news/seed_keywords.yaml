# Seed keywords used to *suggest* a V3 label for a News cluster. Easy to edit.
#
# - Keys must be labels of config/domains_v3.yaml (checked by a test).
# - Terms are lowercase Vietnamese syllables, written exactly like the TF-IDF terms:
#   one syllable ("bầu") or two syllables separated by one space ("bầu cử").
#   A one-syllable seed matches the same one-syllable term. A two-syllable seed matches the
#   same bigram, or (at half weight) both syllables when they are among the cluster's top terms.
# - The result is a scored hint that needs human review. It is NOT a label.
