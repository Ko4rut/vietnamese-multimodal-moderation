version: mcst_v1
description: Research taxonomy inspired by public platform community standards; not official policy.
labels:
  - {id: C01_HATE, name: Hate speech}
  - {id: C02_HARASSMENT, name: Harassment and bullying}
  - {id: C03_VIOLENCE, name: Threats and incitement}
  - {id: C04_GRAPHIC, name: Graphic violence}
  - {id: C05_CRIME, name: Criminal exploitation and dangerous organizations}
  - {id: C06_CHILD_SAFETY, name: Child safety}
  - {id: C07_SEXUAL_ABUSE, name: Sexual exploitation}
  - {id: C08_SEXUAL_CONTENT, name: Sexual content}
  - {id: C09_SELF_HARM, name: Self-harm and eating disorders}
  - {id: C10_DANGEROUS_ACTS, name: Dangerous activities}
  - {id: C11_FRAUD, name: Fraud and scams}
  - {id: C12_REGULATED, name: Regulated goods and services}
  - {id: C13_PRIVACY, name: Privacy violations}
  - {id: C14_MISINFO, name: Misinformation signals}
  - {id: C15_AI_MEDIA, name: AI-generated or altered media signals}
  - {id: C16_SPAM, name: Spam and inauthentic behavior}
actions: [ALLOW, RESTRICT, REMOVE, ESCALATE]
notes:
  - A detected category is not proof of a policy violation.
  - Misinformation and AI-media flags require separate verification.
  - High-risk material requires restricted handling and human review.
