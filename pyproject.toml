[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-topic-classification"
version = "0.1.0"
description = "Single-label Vietnamese text topic classification across 25 VTSNLP domains"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
data = ["datasets>=3.0"]
modeling = ["scikit-learn>=1.3,<2", "joblib>=1.3,<2"]
eda = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "matplotlib>=3.7,<4",
    "scikit-learn>=1.3,<2",
    "ipython>=8.12,<10",
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
    "nbformat>=5.9,<6",
]

[project.scripts]
vtc = "vietnamese_topic_classification.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vietnamese_topic_classification*"]

[tool.setuptools.package-data]
vietnamese_topic_classification = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
