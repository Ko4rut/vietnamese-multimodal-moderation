[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-multimodal-moderation"
version = "0.1.0"
description = "Vietnamese multimodal content moderation research scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
text = ["torch>=2.2", "transformers>=4.40"]
image = ["torch>=2.2", "transformers>=4.40", "pillow>=10"]
video = ["opencv-python-headless>=4.9"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
moderation = "moderation.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moderation = ["config/**/*.yaml", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
